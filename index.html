<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه آزمون آنلاین</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>سامانه آزمون آنلاین</b><span id="timer">--:--</span></header><main>
<section id="start" class="card"><h1 id="title"></h1><p id="info"></p><input id="name" placeholder="نام و نام خانوادگی"><input id="code" placeholder="کد داوطلب"><button onclick="startExam()">شروع آزمون</button><p>ترک تب/صفحه طبق تنظیمات ثبت می‌شود.</p></section>
<section id="exam" class="hidden"><div class="layout"><aside class="card"><h3>سؤالات</h3><div id="nav"></div><button class="danger" onclick="finish(false)">پایان آزمون</button></aside><article class="card"><div id="meta"></div><div id="question"></div><div id="options"></div><div class="actions"><button onclick="prev()">قبلی</button><button onclick="next()">بعدی</button></div></article></div></section>
<section id="result" class="card hidden"><h2>نتیجه</h2><div id="summary"></div></section></main><script src="config.js"></script><script src="questions.js"></script><script src="app.js"></script></body></html>
